name: Restore validated PREVENT engine

on:
  push:
    branches:
      - improve/clinical-safety-v1

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: improve/clinical-safety-v1
          fetch-depth: 0

      - name: Restore PREVENT blocks from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:index.html > /tmp/index-main.html
          python - <<'PY'
          from pathlib import Path
          cur = Path('index.html').read_text()
          orig = Path('/tmp/index-main.html').read_text()

          def replace_section(current, source, start, end):
              a = current.index(start)
              b = current.index(end, a)
              sa = source.index(start)
              sb = source.index(end, sa)
              return current[:a] + source[sa:sb] + current[b:]

          cur = replace_section(
              cur, orig,
              '  {\n    id: "prevent",',
              '  {\n    id: "score2lac",'
          )
          cur = replace_section(
              cur, orig,
              '/* eGFR sin creatinina disponible en el modelo PREVENT:',
              'function importFromLabJson(raw) {'
          )
          Path('index.html').write_text(cur)

          # Assert the PREVENT score definitions and engine now match main exactly.
          def section(s, start, end):
              a=s.index(start); b=s.index(end,a); return s[a:b]
          assert section(cur, '  {\n    id: "prevent",', '  {\n    id: "score2lac",') == section(orig, '  {\n    id: "prevent",', '  {\n    id: "score2lac",')
          assert section(cur, '/* eGFR sin creatinina disponible en el modelo PREVENT:', 'function importFromLabJson(raw) {') == section(orig, '/* eGFR sin creatinina disponible en el modelo PREVENT:', 'function importFromLabJson(raw) {')
          assert 'preventAscvdCategory' not in cur
          PY
          git diff --check

      - name: Commit restoration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/restore-prevent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore validated PREVENT engine"
          git push origin HEAD:improve/clinical-safety-v1
